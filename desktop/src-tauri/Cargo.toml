[package]
name = "sori"
version = "0.1.1"
description = "Sori — voice dictation that types for you"
edition = "2021"

[lib]
name = "sori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Admin-mode crypto (src/admin_crypto.rs is shared with build.rs)
pbkdf2 = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"

[dependencies]
sori-core = { path = "../../crates/sori-core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
cpal = "0.16"
arboard = "3"
sha2 = "0.10"
pbkdf2 = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# On-device STT (whisper.cpp). Metal shaders are embedded and compiled at runtime, so no Xcode needed.
whisper-rs = { version = "0.16", features = ["metal", "raw-api"] }
objc2 = "0.6"
objc2-foundation = "0.3"
core-foundation = "0.10"


[target.'cfg(windows)'.dependencies]
# Vulkan covers NVIDIA/AMD/Intel GPUs; needs the Vulkan SDK at build time. Use `features = ["cuda"]` for CUDA-only builds.
whisper-rs = { version = "0.16", features = ["vulkan", "raw-api"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.16", features = ["raw-api"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
