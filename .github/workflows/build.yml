name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Shareable builds never contain API keys; they default to on-device STT + Claude Code.
  SORI_TEAM_BUILD: "1"

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: cargo test -p sori-core
      - run: npm --prefix desktop ci && npx --prefix desktop tsc --noEmit -p desktop

  macos:
    needs: test
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm --prefix desktop ci
      - name: Build llama-server sidecar (Metal)
        run: ./scripts/build-llama-server.sh
      - name: Build app
        working-directory: desktop
        run: npx tauri build --bundles app --no-sign
      - name: Sign (ad-hoc) and package DMG
        run: |
          APP=target/release/bundle/macos/Sori.app
          codesign --force --deep --options runtime --entitlements desktop/src-tauri/Entitlements.plist --sign - "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          STAGE=$(mktemp -d); cp -R "$APP" "$STAGE/"; ln -s /Applications "$STAGE/Applications"
          mkdir -p dist; hdiutil create -quiet -volname Sori -srcfolder "$STAGE" -ov -format UDZO "dist/Sori-$VERSION-arm64.dmg"
      - uses: actions/upload-artifact@v5
        with: { name: sori-macos, path: dist/*.dmg }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Vulkan SDK (GPU Whisper)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true
      - run: npm --prefix desktop ci
      - name: Build llama-server sidecar (Vulkan)
        shell: bash
        run: ./scripts/build-llama-server.sh
      - name: Build installer
        working-directory: desktop
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v5
        with: { name: sori-windows, path: target/release/bundle/nsis/*.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v5
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
